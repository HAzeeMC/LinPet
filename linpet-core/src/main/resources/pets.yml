schema-version: 1

golden_dragon:
  display-name: "Rồng Vàng"
  rarity: "Ultra Rare"
  default-skin: "MHF_Dragon"
  base-buffs:
    - type: POTION
      effect: REGENERATION
      amplifier: 2
      duration: -1
    - type: POTION
      effect: RESISTANCE
      amplifier: 1
      duration: -1
  attributes:
    - attribute: "minecraft:generic.attack_damage"
      amount: 5.0
      operation: ADD_NUMBER
    - attribute: "minecraft:generic.armor"
      amount: 20.0
      operation: ADD_NUMBER
    - attribute: "linpet:health_regen"
      amount: 1.0
      operation: ADD_NUMBER
    - attribute: "linpet:critical_chance"
      amount: 20.0
      operation: ADD_NUMBER
  special-abilities:
    - "Hồi máu, tăng sát thương và giáp khi trang bị."

